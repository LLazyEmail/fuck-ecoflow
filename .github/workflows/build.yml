name: Build docs

# Build-only verification (PR + main). No GitHub Pages deploy — intentional for this fork.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-docusaurus-test-deploy.yml@v1
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      node-version: '24'
      # LFS objects 404 on this fork historically; keep lfs false (default).
